name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FOUNDRY_PROFILE: default

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Run tests
        run: forge test -vvv

      # Advisory only: gas numbers vary across foundry versions, so the committed
      # snapshot is for human diffs in review, not a hard CI gate.
      - name: Gas snapshot (advisory)
        continue-on-error: true
        run: forge snapshot --check
